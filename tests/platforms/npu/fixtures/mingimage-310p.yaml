# Ming-Image 310P 配方 A 放置变体(官方 deploy/ming_image.yaml 的 310P 运行时覆写,容器内使用,仓库不动)
# 配方 A''(lead O1b 裁决 11-03 12:5x,取代 TP2/TP3):MLLM stage0 **PP2**(tp=1, pp=2)devices 0,1
# (≈9.2GB/芯:层切 8.5GB+复制 embedding 0.65GB,装载相墙彻底解除,余量 ~2.2×)+ DiT stage1 TP1 device 2(15.8GB,83% 峰实证)
# + dav7(device 3)全窗余量。容器逻辑 0,1,2,3 = 物理 davinci4,5,6,7。
# PP2 新面=AR 层间 send/recv 管道:首跑第一动作=PP2 init 探针窗(HCCL 2 成员组=TP2 同族实证面;EH0012 族→stop-and-report)。
# TP3 已被架构面封死(AR heads=16,16%3≠0,vLLM VllmConfig 硬拒)——放置结论入 012。
# FP16-only:top-level dtype 显式 float16(310P 不变量;diffusion patch 另有 od_config 强制兜底)
pipeline: ming_image
async_chunk: false

trust_remote_code: false
distributed_executor_backend: mp
dtype: float16
enable_prefix_caching: false

stages:
  - stage_id: 0
    enforce_eager: true
    tensor_parallel_size: 1
    pipeline_parallel_size: 2
    devices: "0,1"
    gpu_memory_utilization: 0.55
    max_num_seqs: 1
    output_connectors:
      to_stage_1: shared_memory_connector
    default_sampling_params:
      max_tokens: 1
      temperature: 0
      seed: 42

  - stage_id: 1
    enforce_eager: false
    diffusion_compile_granularity: regional
    diffusion_compile_dynamic: true
    cache_backend:
    cache_config:
    tensor_parallel_size: 1
    devices: "2"
    max_num_seqs: 1
    input_connectors:
      from_stage_0: shared_memory_connector
    default_sampling_params:
      seed: 42

connectors:
  shared_memory_connector:
    name: SharedMemoryConnector

edges:
  - from: 0
    to: 1
    window_size: -1
    max_inflight: 1

platforms: {}
