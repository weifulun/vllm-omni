# OmniVoice TTS 310P overlay (task-23): diffusion engine single stage (dit).
# Text -> iterative unmasking -> codebook tokens -> DAC decode -> 24kHz audio.
#
# Differs from the upstream vllm_omni/deploy/omnivoice.yaml ONLY in dtype:
# 310P is FP16-only (COMPARISON-POLICY.md §2), upstream base runs float32.
# Everything else (enforce_eager, deferred ASR, batch knobs) is inherited.

async_chunk: false
pipeline: omnivoice

stages:
  - stage_id: 0
    devices: "0"
    enforce_eager: true
    trust_remote_code: true
    distributed_executor_backend: "mp"
    dtype: "float16"
    additional_config:
      omnivoice_asr:
        # false defers Whisper until ref_audio is sent without ref_text;
        # it does not disable automatic transcription. Set true to load at startup.
        load_asr_on_startup: false
        asr_model_name: "openai/whisper-large-v3-turbo"
        asr_device: null
    max_num_seqs: 8
    request_batch_max_wait_ms: 10
