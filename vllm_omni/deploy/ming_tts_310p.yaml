# Ming-3.0-tts-0.5B (dense) 310P deploy overlay (task-27, model-ming3).
#
# Thin overlay over the base pipeline deploy: 310P is FP16-only (no BF16:
# AclNN EZ1001 exposes no DT_BFLOAT16), so dtype is pinned to float16.
# The base already runs both stages on device "0" (single card), which is
# the 310P single-chip shape under ASCEND_RT_VISIBLE_DEVICES=0; connectors
# and stage geometry are inherited unchanged.
#
# The CFM CUDAGraph fast path stays off on NPU (is_cuda guard + the 310P
# patch pins it off explicitly); the eager flow head is the contract.
base_config: ming_tts.yaml
dtype: float16
