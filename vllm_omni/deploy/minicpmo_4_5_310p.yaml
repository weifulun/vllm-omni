# 310P overlay for MiniCPM-o 4.5 (Ascend CANN 9.1.0, FP16-only, task-8).
#
# Base: minicpmo_4_5.yaml (910 tuning). This overlay:
#   * forces FP16 (POLICY section 2: 310P has no BF16 path);
#   * places the three stages on one Duo card (stage 0 on both chips at TP2,
#     stage 1 on chip 0, stage 2 on chip 1 — devices are container-local
#     torch-npu indexes; mount-recipe.md section 2/3);
#   * disables every NPUGraph adapter (not graph-safe on 310P, research/004;
#     the _310p patch module defends against deployments that skip this file);
#   * disables the Triton fused talker codec prelude (triton-ascend does not
#     target 310P, research/003; the _310p patch also forces the process latch);
#   * right-sizes the per-chip memory budget for the measured 21589 MiB
#     usable per chip (see RISKS.md "VRAM budget").
#
# Real-device TODO(310P-real) resolution (128 C1 first boot, 2026-11-02):
# stage 0 PIECEWISE compiled decode failed on 310P (rope cos null under
# AOTAutograd partition) -> stage 0 runs enforce_eager: true below. Stage 1
# FULL_DECODE_ONLY cudagraph / speculative K=8 remain at base values pending
# the first successful stage 0 boot (fallbacks: enforce_eager / drop
# speculative_config).

base_config: minicpmo_4_5.yaml
dtype: float16

stages:
  - stage_id: 0
    tensor_parallel_size: 2
    devices: "0,1"
    # boot15-16 (128 C1): 0.75 -> 0.70. chip1 device math: TP-rank pool
    # 14.49 + stage2 pool 4.56 + CANN overhead ~1.1 = 20.2 of 20.51 GiB,
    # leaving 312 MiB free vs the 376-438 MiB TTS flow-cache allocation
    # (device-level OOM in _split_flow_cache, boot10-15). 0.70 drops the
    # TP-rank pool ~1.0 GiB (15.38 -> 14.94 GiB ceiling). KV shrinks
    # 0.99 -> ~0.6 GiB; the engine's max-model-length check fails loudly
    # at boot if it is not enough.
    gpu_memory_utilization: 0.71
    max_model_len: 8192
    # Real-device (128 C1, 2026-11-03): shrink the profile dummy batch to cap the
    # retained caching-allocator blocks under the EH0012 no-op (aee740b99):
    # peak = base + dummy activations + retained cache, and the margin is what
    # funds the 8192-token KV check (0.57 GiB engine-side).
    # boot10-12 (2026-11-03): the dummy-run activation high-water stays in the
    # caching pool per TP rank (measured 14.5 GiB/rank on chip1); a smaller
    # dummy frees ~2 GiB on each shared chip for the stage-2 TTS flow cache.
    # NOTE (boot12): this flat key is overridden AFTER parsing by the base
    # overlay's platforms.npu.stages[0] entry (910B1 tuning: 8192); the
    # effective override lives in the platforms section below.
    max_num_batched_tokens: 2048
    # Real-device first boot (128 C1, 2026-11-02): the base PIECEWISE
    # compiled decode fails on 310P — aclnnApplyRotaryPosEmbV2 gets a null
    # cos tensor under the torch.compile/AOTAutograd partition
    # (AclNN_Parameter_Error EZ1001 "Check cos != nullptr"). Documented
    # TODO(310P-real) fallback: enforce_eager for this stage.
    enforce_eager: true
    # Real-device (128 C2, 2026-11-02) measurement-driven bump: profile peak
    # (weights 10.4 + encoders 1.4 + LLM-dummy activations ~1.6) leaves only
    # ~1.8 GiB for KV at mmu 0.68 before the 310P worker halves it for
    # workspace (0.48 GiB < 0.57 GiB needed for 8192 tokens) -> 0.72.
    # Real-device (128 C2, 2026-11-02): the v1 profile_run dummy-multimodal
    # pass (2 max-feature-size video items + image + audio) peaks ~6 GiB of
    # encoder activations on top of the 11.8 GiB of TP2 weights + replicated
    # SigLIP/Whisper encoders — beyond the 21.08 GiB chip budget before any
    # KV is allocated. Skip the multimodal profiling pass: KV sizing then
    # measures the LLM-only peak (correct for AR budgeting); runtime encoder
    # activations draw on the KV headroom (residual risk for very large
    # videos documented in the task report; INT8 tier is the escalation path).
    skip_mm_profiling: true
  - stage_id: 1
    devices: "0"
    # Real-device (128 C2, 2026-11-02): stage 1 boots with the base
    # FULL_DECODE_ONLY cudagraph capture; on 310P the talker's decode step
    # runs through the 310P rope torch-fallback (cos-slice None for the
    # MiniCPM-o configs), which is not torch._dynamo fullgraph-capture-safe
    # -> ACL capture crashes engine init. Documented fallback: eager decode
    # (ngram K speculation stays on; it is orthogonal to graphs).
    enforce_eager: true
  - stage_id: 2
    devices: "1"

platforms:
  npu:
    stages:
      - stage_id: 0
        # NOTE: this platform layer is the effective writer (see the
        # max_num_batched_tokens note below); keep both layers in sync.
        # boot16 (128 C1): 0.75 -> 0.70, chip1 headroom for the stage-2 TTS
        # flow cache (flat-stage comment carries the full math).
        gpu_memory_utilization: 0.71
        # Real-device (128 C1, 2026-11-03, boot10-12): the base 910B1 tuning
        # pins 8192 at THIS platform layer (applied after stage parsing, so it
        # wins over the flat stage key). The 8192-token profile dummy leaves a
        # 14.5 GiB/rank retained caching pool on each TP rank (measured via
        # npu-smi proc-mem), which starves the co-located stage-2 code2wav flow
        # cache (438 MiB request, 169 MiB free -> OOM). 2048 halves the dummy
        # activation high-water and frees the headroom stage 2 needs on chip1.
        max_num_batched_tokens: 2048
        additional_config:
          encoder_enable_npu_graph: false
      - stage_id: 1
        kv_cache_memory_bytes: 1073741824
      - stage_id: 2
        # Real-device (128 C1, 2026-11-03): stage 2 shares chip1 with the
        # Thinker TP2 rank. Without an explicit cap the shared-chip free-based
        # KV sizing consumed nearly all remaining free memory as KV, leaving
        # no room for the runtime DiT flow cache (NPU OOM in
        # _split_flow_cache: 438 MiB request vs 169 MiB free). Cap the KV at
        # 1 GiB like stage 1; the code2wav KV is a small formality (the real
        # streaming state lives in the flow/HiFT runtime caches).
        kv_cache_memory_bytes: 1073741824
        # Real-device (128 C1, 2026-11-03, boot10-14): the base 910B1 overlay
        # inherits gpu_memory_utilization: 0.22 at this platform layer, which
        # sizes the stage-2 pool to ~4.5 GiB on chip1 (measured 4.53 GiB at
        # OOM: 14.84 TP-rank pool + 4.53 stage-2 pool + ~0.4 flow cache >
        # 20.51 GiB). Stage 2's real memory is weights (~0.7 GiB) + runtime
        # flow/HiFT state; its KV is a small formality. 0.15 cuts the pool to
        # ~3.1 GiB and leaves chip1 ~1.8 GiB of headroom for the per-request
        # fp32 estimator attention cache.
        gpu_memory_utilization: 0.15
        additional_config:
          code2wav_enable_npu_graph: false
          # NOTE: token2wav_float16 must live in the connectors section extra,
          # not here: code2wav reads _extra_config() =
          # stage_connector_config.extra (see boot12: the platform-layer copy
          # never took effect).

connectors:
  connector_of_shared_memory:
    # The code2wav model reads _extra_config() = this connector extra dict
    # (minicpmo_4_5_code2wav.py:1527). Runtime-only flags that must reach
    # stage 2 belong HERE, not in the platform additional_config.
    extra:
      talker_codec_fused_prelude: false
      enable_hift_graph: false
      enable_cfm_graph: false
      enable_code2wav_encoder_graph: false
      # REAL-DEVICE LESSON (128 C1, 2026-11-03, boot13): token2wav_float16 was
      # TRIED here (the only layer that reaches code2wav's _extra_config()) and
      # is REVERTED: it casts the whole CFM estimator to fp16 weights while the
      # causal-conv1d chunk stream feeds fp32 inputs, so the first TTS request
      # dies in CausalConv1d with "Input type (float) and bias type (c10::Half)
      # should be the same" and kills the stage-2 replica. The stage-0 dummy
      # shrink (platform-layer max_num_batched_tokens: 2048) frees the memory
      # on its own, so the fp32 estimator cache (438 MiB per request) now fits
      # on chip1. Do not re-enable without an fp16 input-cast patch first.
