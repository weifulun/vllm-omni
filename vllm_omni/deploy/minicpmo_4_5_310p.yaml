# 310P overlay for MiniCPM-o 4.5 (Ascend CANN 9.1.0, FP16-only, task-8).
#
# Base: minicpmo_4_5.yaml (910 tuning). This overlay:
#   * forces FP16 (POLICY section 2: 310P has no BF16 path);
#   * places the three stages on one Duo card (stage 0 on both chips at TP2,
#     stage 1 on chip 0, stage 2 on chip 1 — devices are container-local
#     torch-npu indexes; mount-recipe.md section 2/3);
#   * disables every NPUGraph adapter (not graph-safe on 310P, research/004;
#     the _310p patch module defends against deployments that skip this file);
#   * disables the Triton fused talker codec prelude (triton-ascend does not
#     target 310P, research/003; the _310p patch also forces the process latch);
#   * right-sizes the per-chip memory budget for the measured 21589 MiB
#     usable per chip (see RISKS.md "VRAM budget").
#
# Real-device TODO(310P-real) resolution (128 C1 first boot, 2026-11-02):
# stage 0 PIECEWISE compiled decode failed on 310P (rope cos null under
# AOTAutograd partition) -> stage 0 runs enforce_eager: true below. Stage 1
# FULL_DECODE_ONLY cudagraph / speculative K=8 remain at base values pending
# the first successful stage 0 boot (fallbacks: enforce_eager / drop
# speculative_config).

base_config: minicpmo_4_5.yaml
dtype: float16

stages:
  - stage_id: 0
    tensor_parallel_size: 2
    devices: "0,1"
    gpu_memory_utilization: 0.78
    max_model_len: 4096
    # Real-device first boot (128 C1, 2026-11-02): the base PIECEWISE
    # compiled decode fails on 310P — aclnnApplyRotaryPosEmbV2 gets a null
    # cos tensor under the torch.compile/AOTAutograd partition
    # (AclNN_Parameter_Error EZ1001 "Check cos != nullptr"). Documented
    # TODO(310P-real) fallback: enforce_eager for this stage.
    enforce_eager: true
    # Real-device (128 C2, 2026-11-02) measurement-driven bump: profile peak
    # (weights 10.4 + encoders 1.4 + LLM-dummy activations ~1.6) leaves only
    # ~1.8 GiB for KV at mmu 0.68 before the 310P worker halves it for
    # workspace (0.48 GiB < 0.57 GiB needed for 8192 tokens) -> 0.72.
    # Real-device (128 C2, 2026-11-02): the v1 profile_run dummy-multimodal
    # pass (2 max-feature-size video items + image + audio) peaks ~6 GiB of
    # encoder activations on top of the 11.8 GiB of TP2 weights + replicated
    # SigLIP/Whisper encoders — beyond the 21.08 GiB chip budget before any
    # KV is allocated. Skip the multimodal profiling pass: KV sizing then
    # measures the LLM-only peak (correct for AR budgeting); runtime encoder
    # activations draw on the KV headroom (residual risk for very large
    # videos documented in the task report; INT8 tier is the escalation path).
    skip_mm_profiling: true
  - stage_id: 1
    devices: "0"
    # Real-device (128 C2, 2026-11-02): stage 1 boots with the base
    # FULL_DECODE_ONLY cudagraph capture; on 310P the talker's decode step
    # runs through the 310P rope torch-fallback (cos-slice None for the
    # MiniCPM-o configs), which is not torch._dynamo fullgraph-capture-safe
    # -> ACL capture crashes engine init. Documented fallback: eager decode
    # (ngram K speculation stays on; it is orthogonal to graphs).
    enforce_eager: true
  - stage_id: 2
    devices: "1"

platforms:
  npu:
    stages:
      - stage_id: 0
        gpu_memory_utilization: 0.72
        additional_config:
          encoder_enable_npu_graph: false
      - stage_id: 1
        kv_cache_memory_bytes: 1073741824
      - stage_id: 2
        additional_config:
          code2wav_enable_npu_graph: false

connectors:
  connector_of_shared_memory:
    extra:
      talker_codec_fused_prelude: false
      enable_hift_graph: false
      enable_cfm_graph: false
      enable_code2wav_encoder_graph: false
